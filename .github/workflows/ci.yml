# What a machine can check without touching the database.
#
# The smoke tests are deliberately NOT here. smoke-rls, smoke-phase4 and
# smoke-0017 each need SUPABASE_DB_URL and connect to the real project, and a
# service-role connection string does not belong in GitHub Actions for a public
# repo. They stay a local gate, run before Will pushes a migration.
#
# Lint runs with --max-warnings 0. The Sessions list now reads through
# useLeagueData(), which removed the last set-state-in-effect warning. Keep the
# ratchet at zero so warnings cannot silently become a new baseline.
#
# Was 2. Phase 5C lifted the members fetch into useMembershipData(), which
# cleared GroupMembersPage:39 — so the ratchet comes down with it. Tightening
# it is the half people forget, and an untightened ratchet is just a loose
# limit with a good story.

name: CI

# Every push, every branch — one run per commit.
#
# This started as `pull_request` plus `push` on [main, v1.1.0], which meant a
# phase branch got no CI at all until a PR was opened. Pushes to
# phase-5-settings triggered nothing.
#
# `pull_request` is gone rather than added to, because it would double-run: a
# push to a branch with an open PR fires both, on different refs. A check run
# attaches to a commit SHA, not to a PR, so a push-triggered run still shows up
# in the PR's checks — the status is there either way.
#
# What that trades away: `pull_request` tests the MERGE result, while `push`
# tests the branch tip. Those differ when the base has moved on underneath you.
# Here they do not — this history is linear and every merge is a fast-forward,
# so the merge result IS the branch tip. Revisit if that ever stops being true.
on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint -- --max-warnings 0
